# Dmr x AI — Docker stack
# Tunnel: dmrxai.devplay.online + 9router.devplay.online via Cloudflare
# Run: docker compose up -d --build

name: dmrxai

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dmrxai-app:latest
    container_name: dmrxai-app
    restart: unless-stopped
    networks: [dmrxai-net]
    group_add:
      - "999" # docker group (host) — akses /var/run/docker.sock via dockerode
    # Allow the app container to reach the host (9router native runs on the
    # host, not in a container). Sandbox containers do NOT get this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    volumes:
      # Docker daemon access for App Builder sandbox (dockerode).
      # Hanya di-mount ke app (bukan sandbox). Sandbox TIDAK pernah dapat socket ini.
      - /var/run/docker.sock:/var/run/docker.sock
      # Sandbox workspaces (base dir per-project). Container app membuat
      # subfolder /srv/dmrxai/sandboxes/sb-<projectId>/project di sini.
      - ${DMRXAI_SANDBOX_DIR:-/srv/dmrxai/sandboxes}:/srv/dmrxai/sandboxes
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: ${TZ:-Asia/Jakarta}
      # Supabase (client-side, prefix NEXT_PUBLIC_ — safe for browser).
      # Service role key is NOT exposed here (server-only, set via .env).
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      # Server-only Supabase service role key (never sent to browser).
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # AI Backend — server-side hardcoded.
      # User TIDAK bisa override dari Settings UI; semua request keluar
      # pakai AI_API_KEY ini ke 9router internal.
      AI_BASE_URL: ${AI_BASE_URL:-http://9router:20128/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      # Allowlist host yang boleh di-fetch server (SSRF guard). Untuk 9router
      # native via host.docker.internal, set ke host.docker.internal.
      ALLOWED_AI_HOSTS: ${ALLOWED_AI_HOSTS:-}
      # Legacy: usage endpoint (opsional, kosongkan kalau tidak pakai)
      DMRXAI_API_URL: ${DMRXAI_API_URL:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # Donation feature (fitur-donate): forwards Trakteer API key into container
      TRAKTEER_API_KEY: ${TRAKTEER_API_KEY:-}
      # App Builder sandbox (Docker self-host by default, E2B alternative)
      DMRXAI_SANDBOX_PROVIDER: ${DMRXAI_SANDBOX_PROVIDER:-docker}
      DMRXAI_SANDBOX_DIR: ${DMRXAI_SANDBOX_DIR:-/srv/dmrxai/sandboxes}
      DMRXAI_PREVIEW_HOST: ${DMRXAI_PREVIEW_HOST:-https://preview.devplay.online}
      DMRXAI_SANDBOX_IMAGE: ${DMRXAI_SANDBOX_IMAGE:-node:20-alpine}
      E2B_API_KEY: ${E2B_API_KEY:-}
      E2B_TEMPLATE: ${E2B_TEMPLATE:-base}
    depends_on:
      - 9router
      - searxng
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: dmrxai-preview
    restart: unless-stopped
    networks: [dmrxai-net, dmrxai-sandbox-net]
    expose:
      - "8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  9router:
    image: decolua/9router:latest
    container_name: dmrxai-9router
    restart: unless-stopped
    networks: [dmrxai-net]
    expose:
      - "20128"
    environment:
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./9router-data:/app/data
    cap_drop:
      - ALL
    cap_add:
      # su-exec di entrypoint butuh CAP_SETGID + CAP_SETUID untuk drop
      # ke user non-root. CAP_CHOWN untuk chown data dir saat init.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  searxng:
    image: searxng/searxng:latest
    container_name: dmrxai-searxng
    restart: unless-stopped
    networks: [dmrxai-net]
    expose:
      - "8080"
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      INSTANCE_NAME: dmrxai-search
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./searxng-config:/etc/searxng:rw
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dmrxai-tunnel
    restart: unless-stopped
    networks: [dmrxai-net]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-config:/etc/cloudflared:ro
    depends_on:
      - app
      - 9router
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  dmrxai-net:
    name: dmrxai-net
    driver: bridge
  dmrxai-sandbox-net:
    name: dmrxai-sandbox-net
    external: true

volumes:
  caddy-data:
  caddy-config:
